schema_version: 1
track: local
domain: desktop

cases:
  - id: LD01
    upstream: windows_agent_arena
    upstream_case_id: 366de66e-cbae-4d72-b042-26390db2b145-WOS
    difficulty: simple
    split: development
    environment: Windows host / Notepad and isolated file workspace
    applications:
      - Notepad
    official_evaluator: exact_match(vm_file_exists_in_vm_folder) + compare_text_file
    evaluator_reuse: >-
      OmniAct-adapted: reuse the official compare_text_file metric after a
      host-path collector. The full WindowsAgentArena DesktopEnv and VM getter
      pipeline are not used on the local host.
    task: >-
      Please open Notepad, create a new file named "draft.txt", type "This is a
      draft.", and save it to the Documents folder.
    fixture: >-
      A deterministic empty Documents workspace; the expected local result is
      draft.txt with exactly "This is a draft." and no network input.
    fixture_root: fixtures/local-desktop/LD01
    run_root: runs/local-desktop/LD01
    launches:
      - command: notepad.exe
        args: []
        track: true
    local_task: >-
      Treat OMNIACT_BENCH_HOME/runs/local-desktop/LD01/Documents as the opened
      Documents folder for this case and do not use the real user Documents folder.
    verification:
      kind: text
      output: Documents/draft.txt
      expected: expected/draft.txt
    reset: >-
      Replace OMNIACT_BENCH_HOME/runs/local-desktop/LD01 with a recursive copy of
      OMNIACT_BENCH_HOME/fixtures/local-desktop/LD01. Do not touch C: or real user
      folders.
    requirements:
      paths:
        - fixtures/local-desktop/LD01/expected/draft.txt
      commands:
        - notepad.exe
      urls: []

