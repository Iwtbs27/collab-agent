    evaluator_reuse: >-
      OmniAct-adapted: reuse the official file-content comparison after host-path
      collection; WindowsAgentArena VM file retrieval is replaced only for the
      isolated case root.
    task: >-
      Copy the file "example.txt" from the Desktop to the Documents folder and
      then rename it to "example_renamed.txt".
    fixture: >-
      A deterministic Desktop/example.txt fixture with fixed text. The expected
      Documents/example_renamed.txt must preserve that text exactly.
    fixture_root: fixtures/local-desktop/LD02
    run_root: runs/local-desktop/LD02
    launches:
      - command: explorer.exe
        args: ['/separate,{run}\Desktop']
        track: true
    local_task: >-
      Treat OMNIACT_BENCH_HOME/runs/local-desktop/LD02/Desktop and Documents as
      this case's opened folders; do not use the real user Desktop or Documents.
    verification:
