      output: Documents/example_renamed.txt
      expected: Desktop/example.txt
    reset: >-
      Replace OMNIACT_BENCH_HOME/runs/local-desktop/LD02 with a recursive copy of
      OMNIACT_BENCH_HOME/fixtures/local-desktop/LD02. Do not touch C: or real user
      folders.
    requirements:
      paths:
        - fixtures/local-desktop/LD02/Desktop/example.txt
      commands:
        - explorer.exe
      urls: []

